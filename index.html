<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Synced Interfaces</title>
<meta name="description" content="Scripts and small projects I'm fine sharing. Open source, free to use.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css?v=1.1247-2">
<script>
document.documentElement.dataset.theme = localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
</script>
</head>
<body>
<header class="site-header">
    <div class="bar page">
        <a class="brand" href="/">Synced Interfaces</a>
        <nav class="nav">
            <a href="#scripts">Scripts</a>
            <a href="https://gitlab.com/SyncedInterfaces/Free-Scripts/-/tree/main" target="_blank" rel="noopener">GitLab</a>
            <a href="https://discord.gg/syncedd" target="_blank" rel="noopener">Discord</a>
            <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to light mode" title="Switch to light mode">
                <svg class="theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>
                <svg class="theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.9 13a9 9 0 0 1-9.9-9.9A9 9 0 1 0 20.9 13Z"/></svg>
            </button>
        </nav>
    </div>
</header>
<div class="page">
<main>
    <section class="hero">
        <h1>Free Scripts</h1>
        <p class="tagline">Scripts and small projects I'm fine sharing. Open source, free to use.</p>
        <div class="actions">
            <a class="button primary" href="#scripts">Scripts</a>
            <a class="button" href="https://gitlab.com/SyncedInterfaces/Free-Scripts/-/tree/main" target="_blank" rel="noopener">GitLab</a>
        </div>
    </section>
    <section id="scripts">
        <h2 class="section-head">Scripts</h2>
        <div class="script-list" id="script-list">
            <p class="script-status">Loading scripts…</p>
        </div>
    </section>
</main>
<footer class="site-footer">Synced Interfaces &middot; <a href="https://discord.gg/syncedd" target="_blank" rel="noopener">Discord</a></footer>
</div>
<script>
(function () {
    var root = document.documentElement;
    var button = document.getElementById("theme-toggle");
    function label() {
        var action = root.dataset.theme === "light" ? "Switch to dark mode" : "Switch to light mode";
        button.setAttribute("aria-label", action);
        button.title = action;
    }
    label();
    button.addEventListener("click", function () {
        root.dataset.theme = root.dataset.theme === "light" ? "dark" : "light";
        localStorage.setItem("theme", root.dataset.theme);
        label();
    });
})();
(function () {
    var REPO = "SyncedInterfaces/Free-Scripts";
    var PROJECT = encodeURIComponent(REPO);
    var RAW = "https://gitlab.com/" + REPO + "/-/raw/main/";
    var SOURCE = "https://gitlab.com/" + REPO + "/-/blob/main/";
    var list = document.getElementById("script-list");

    function titleFrom(name) {
        return name.replace(/\.lua$/i, "").replace(/([a-z])([A-Z])/g, "$1 $2").replace(/[_-]+/g, " ");
    }

    function loadstringFor(name) {
        return 'loadstring(game:HttpGet("' + RAW + encodeURIComponent(name) + '"))()';
    }

    function card(file) {
        var article = document.createElement("article");
        article.className = "script-card";
        var head = document.createElement("div");
        head.className = "script-head";
        var title = document.createElement("h3");
        title.textContent = titleFrom(file.name);
        var fileName = document.createElement("p");
        fileName.className = "script-file";
        fileName.textContent = file.name;
        head.appendChild(title);
        head.appendChild(fileName);
        var code = document.createElement("code");
        code.className = "script-load";
        code.textContent = loadstringFor(file.name);
        var actions = document.createElement("div");
        actions.className = "script-actions";
        var copy = document.createElement("button");
        copy.className = "button primary";
        copy.type = "button";
        copy.textContent = "Copy loadstring";
        copy.addEventListener("click", function () {
            var text = code.textContent;
            var done = function () {
                copy.textContent = "Copied";
                setTimeout(function () { copy.textContent = "Copy loadstring"; }, 1400);
            };
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(done, function () {});
            }
        });
        var source = document.createElement("a");
        source.className = "button";
        source.href = SOURCE + encodeURIComponent(file.name);
        source.target = "_blank";
        source.rel = "noopener";
        source.textContent = "Source";
        actions.appendChild(copy);
        actions.appendChild(source);
        article.appendChild(head);
        article.appendChild(code);
        article.appendChild(actions);
        return article;
    }

    function show(files) {
        list.textContent = "";
        if (!files.length) {
            var empty = document.createElement("p");
            empty.className = "script-status";
            empty.textContent = "No scripts are released yet.";
            list.appendChild(empty);
            return;
        }
        files.sort(function (a, b) { return a.name.localeCompare(b.name); });
        files.forEach(function (file) { list.appendChild(card(file)); });
    }

    fetch("https://gitlab.com/api/v4/projects/" + PROJECT + "/repository/tree?ref=main&per_page=100")
        .then(function (response) {
            if (!response.ok) throw new Error("gitlab");
            return response.json();
        })
        .then(function (entries) {
            show(entries.filter(function (entry) {
                return entry.type === "blob" && /\.lua$/i.test(entry.name);
            }));
        })
        .catch(function () {
            show([
                { name: "Gambling.lua" },
                { name: "VoiceChatBypass.lua" }
            ]);
        });
})();
</script>
</body>
</html>
