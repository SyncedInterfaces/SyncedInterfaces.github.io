<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{NAME}}</title>
<meta name="description" content="{{TAGLINE}}">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css?v={{VERSION}}">
<script>
document.documentElement.dataset.theme = localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
</script>
</head>
<body>
<header class="site-header">
    <div class="bar page">
        <a class="brand" href="/">{{NAME}} <span class="version-badge">v{{VERSION}}</span></a>
        <nav class="nav">
            <a href="#features">Features</a>
            <a href="#changelog">Changelog</a>
            {{GITHUB_LINK}}
            <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to light mode" title="Switch to light mode">
                <svg class="theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>
                <svg class="theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.9 13a9 9 0 0 1-9.9-9.9A9 9 0 1 0 20.9 13Z"/></svg>
            </button>
        </nav>
    </div>
</header>
<div class="page">
<main>
    <section class="hero">
        <h1>{{NAME}}</h1>
        <p class="tagline">{{TAGLINE}}</p>
        <div class="actions">
            {{SCRIPT_BUTTON}}
        </div>
    </section>
    <section id="features">
        <h2 class="section-head">Feature List</h2>
{{FEATURE_COLUMNS}}
    </section>
    <section id="changelog">
        <h2 class="section-head">Changelog</h2>
{{CHANGELOG_ROWS}}
    </section>
</main>
<footer class="site-footer">{{NAME}} v{{VERSION}}{{DISCORD_FOOTER}}</footer>
</div>
<script>
(function () {
    var root = document.documentElement;
    var button = document.getElementById("theme-toggle");
    function label() {
        var action = root.dataset.theme === "light" ? "Switch to dark mode" : "Switch to light mode";
        button.setAttribute("aria-label", action);
        button.title = action;
    }
    label();
    button.addEventListener("click", function () {
        root.dataset.theme = root.dataset.theme === "light" ? "dark" : "light";
        localStorage.setItem("theme", root.dataset.theme);
        label();
    });
})();
</script>
</body>
</html>
