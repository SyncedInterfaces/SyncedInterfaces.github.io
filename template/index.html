<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{NAME}}</title>
<meta name="description" content="{{TAGLINE}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="style.css?v={{VERSION}}">
<script>
document.documentElement.dataset.theme = localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
</script>
</head>
<body>
<header class="site-header">
    <div class="bar page">
        <a class="brand" href="/">{{NAME}} <span class="version-badge">v{{VERSION}}</span></a>
        <nav class="nav">
            <a href="#features">Features</a>
            <a href="#changelog">Changelog</a>
            {{GITHUB_LINK}}
            <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle theme"></button>
        </nav>
    </div>
</header>
<div class="page">
<main>
    <section class="hero">
        <h1>{{NAME}}</h1>
        <p class="tagline">{{TAGLINE}}</p>
        <div class="actions">
            {{SCRIPT_BUTTON}}
        </div>
    </section>
    <section id="features">
        <h2 class="section-head">Feature List</h2>
{{FEATURE_COLUMNS}}
    </section>
    <section id="changelog">
        <h2 class="section-head">Changelog</h2>
{{CHANGELOG_ROWS}}
    </section>
</main>
<footer class="site-footer">{{NAME}} v{{VERSION}}{{DISCORD_FOOTER}}</footer>
</div>
<script>
(function () {
    var root = document.documentElement;
    var button = document.getElementById("theme-toggle");
    function label() {
        button.textContent = root.dataset.theme === "light" ? "Dark" : "Light";
    }
    label();
    button.addEventListener("click", function () {
        root.dataset.theme = root.dataset.theme === "light" ? "dark" : "light";
        localStorage.setItem("theme", root.dataset.theme);
        label();
    });
})();
</script>
</body>
</html>
